<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Autonomous Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 500px; padding: 20px; }
        h1 { font-size: 24px; color: #00ff88; margin-bottom: 8px; letter-spacing: 2px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 40px; letter-spacing: 1px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; letter-spacing: 1px; }
        textarea { width: 100%; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 14px 18px; color: #e0e0e0; fontamily: 'Courier New', monospace; font-size: 14px; outline: none; resize: vertical; min-height: 100px; }
        textarea:focus { border-color: #00ff88; }
        button { width: 100%; background-color: #00ff88; color: #0f0f0f; border: none; border-radius: 6px; padding: 14px; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; cursor: pointer; letter-spacing: 1px; margin-top: 10px; }
        .hint { font-size: 12px; color: #666; margin-top: 8px; }
        .success { background-color: #1a2a1a; border: 1px solid #00ff88; border-radius: 6px; padding: 12px 16px; font-size: 13px; color: #00ff88; margin-bottom: 20px; }
        .back { display: block; text-align: center; margin-top: 24px; font-size: 13px; color: #00ff88; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SETTINGS</h1>
        <p class="subtitle">Personalize your daily digest</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="success">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" action="/settings">
            <label>YOUR INTERESTS (comma separated)</label>
            <textarea name="interests" placeholder="AI, cricket, stocks, Bollywood, India tech">{{ interests }}</textarea>
            <p class="hint">Examples: AI, cricket, stocks, India tech, world news, Bollywood, law, science</p>
            <button type="submit">SAVE INTERESTS</button>
        </form>
        <a href="/dashboard" class="back">Back to Dashboard</a>
    </div>
</body>
</html>
