name: Deploy to AWS

on:
  push:
    branches:
      - fresh-main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u arhamsabri2-creator --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/arhamsabri2-creator/autonomous-agent:latest .

      - name: Push Docker image
        run: docker push ghcr.io/arhamsabri2-creator/autonomous-agent:latest

      - name: SSH into AWS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u arhamsabri2-creator --password-stdin
            sudo systemctl stop autonomous-agent
            docker pull ghcr.io/arhamsabri2-creator/autonomous-agent:latest
            docker stop autonomous-agent || true
            docker rm autonomous-agent || true
            docker run -d --name autonomous-agent --env-file /home/ubuntu/autonomous-agent/.env -p 7860:7860 --restart always ghcr.io/arhamsabri2-creator/autonomous-agent:latest